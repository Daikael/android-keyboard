name: Personal build

on:
  workflow_dispatch:
  push:
    branches:
      - personal/finetune-forward

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: personal/finetune-forward
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch master for versionCode
        run: |
          set -euo pipefail
          # versionCode is git rev-list --count master. A shallow checkout would
          # freeze that number and block later APKs from installing as updates.
          if [ -f .git/shallow ]; then
            git fetch --unshallow origin
          fi
          git fetch origin master:master

      - name: Git LFS for submodules
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          # futo-swipe is a Hugging Face repo and stores model files in Git LFS.
          # checkout does not pull LFS objects inside submodules.
          git submodule foreach --recursive 'git lfs pull'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, NDK, and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | tr -d '\n\r ' | base64 -d > "${RUNNER_TEMP}/release.jks"
            keytool -list -keystore "${RUNNER_TEMP}/release.jks" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" >/dev/null
            {
              echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks"
              echo "KEY_ALIAS=${KEY_ALIAS}"
            } >> "${GITHUB_ENV}"
            {
              echo "KEYSTORE_PASSWORD<<EOF"
              echo "${KEYSTORE_PASSWORD}"
              echo "EOF"
              echo "KEY_PASSWORD<<EOF"
              echo "${KEY_PASSWORD}"
              echo "EOF"
            } >> "${GITHUB_ENV}"
            echo "mode=release" >> "${GITHUB_OUTPUT}"
            echo "Signing with repository keystore secrets."
          else
            echo "::warning::KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD are not all set. Signing with an ephemeral fallback key. This APK will not install as an update over a previous install."
            keytool -genkeypair -v \
              -keystore "${RUNNER_TEMP}/fallback.jks" \
              -alias personal-fallback \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass fallback-not-for-updates \
              -keypass fallback-not-for-updates \
              -dname "CN=Daikael FUTO Keyboard fallback (not for updates), OU=Personal, O=Daikael"
            {
              echo "KEYSTORE_FILE=${RUNNER_TEMP}/fallback.jks"
              echo "KEYSTORE_PASSWORD=fallback-not-for-updates"
              echo "KEY_ALIAS=personal-fallback"
              echo "KEY_PASSWORD=fallback-not-for-updates"
            } >> "${GITHUB_ENV}"
            echo "mode=fallback" >> "${GITHUB_OUTPUT}"
            {
              echo "### Signing"
              echo "Ephemeral fallback key (CN=Daikael FUTO Keyboard fallback (not for updates))."
              echo "Updates will not install over a previous install. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets to sign with a stable key."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Build stable release APK
        run: ./gradlew assembleStableRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daikael-futo-keyboard-stable-${{ steps.signing.outputs.mode }}
          path: build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
